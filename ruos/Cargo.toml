[package]
name = "ruos"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ccc-claude-opus/ruos"
description = "A capability microkernel teaching OS with Docker-like pods: the OS runs in the browser (WebAssembly), this is its server on your desktop"
readme = "README.md"
keywords = ["os", "kernel", "capability", "wasm", "education"]
categories = ["command-line-utilities", "wasm"]
include = ["src/**", "build.rs", "assets/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
blake3 = "1.8"
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
ureq = "3"
redis = { version = "0.32", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
tokio-postgres = "0.7"
