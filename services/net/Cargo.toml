[package]
name = "net"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "net"
path = "src/main.rs"
test = false
bench = false

[dependencies]
libsys = { path = "../../libsys" }
virtio = { path = "../../virtio" }
smoltcp = { version = "0.14", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-tcp"] }
