# root: the shell's file system. Each boot puts its own writable layer on
# top (b{boot}-shell); `save` commits that layer back into this image.
name = "root"
entry = "/bin/shell"

[programs]
"/bin/shell" = "shell"
"/bin/hello" = "hello"
"/bin/snoop" = "snoop"
"/bin/wasi-hello" = "wasi-hello"

[files]
"/etc/motd" = "root/motd.txt"
"/home/README.txt" = "root/README.txt"
"/home/poem.txt" = "root/poem.txt"
"/home/count.sh" = "root/count.sh"
"/home/kube/web.toml" = "root/kube/web.toml"
"/home/kube/flaky.toml" = "root/kube/flaky.toml"
"/home/kube/small.toml" = "root/kube/small.toml"
"/home/kube/crowd.toml" = "root/kube/crowd.toml"
"/home/kube/echo.toml" = "root/kube/echo.toml"
"/home/kube/front.toml" = "root/kube/front.toml"
"/home/kube/greeting.toml" = "root/kube/greeting.toml"
"/home/kube/stuck.toml" = "root/kube/stuck.toml"
"/home/kube/spread.toml" = "root/kube/spread.toml"
"/home/kube/pinned.toml" = "root/kube/pinned.toml"
"/home/kube/fn-hello.toml" = "root/kube/fn-hello.toml"
"/home/kube/fn-count.toml" = "root/kube/fn-count.toml"
"/home/kube/fn-cgi.toml" = "root/kube/fn-cgi.toml"
"/home/kube/fn-site.toml" = "root/kube/fn-site.toml"
"/tmp/.ruos-dir" = "root/empty"
